<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Standings, results and player leaderboards for the Givash Gals fantasy league, where the lowest score wins."
    />
    <title>Givash Gals — lowest score wins</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="masthead">
      <div class="masthead-inner">
        <div class="brand">
          <h1>Givash Gals</h1>
          <p class="tagline">Lowest score wins</p>
        </div>
        <p id="freshness" class="freshness" role="status" hidden></p>
      </div>

      <nav class="tabs-nav" aria-label="Sections">
        <div class="tabs-nav-inner" role="tablist">
          <button role="tab" id="tab-standings" aria-controls="standings" aria-selected="true"
                  data-view="standings" class="active" type="button">Standings</button>
          <button role="tab" id="tab-results" aria-controls="results" aria-selected="false"
                  data-view="results" type="button">Results</button>
          <button role="tab" id="tab-players" aria-controls="players" aria-selected="false"
                  data-view="players" type="button">Players</button>
          <button role="tab" id="tab-rules" aria-controls="rules" aria-selected="false"
                  data-view="rules" type="button">Rules</button>
        </div>
      </nav>
    </header>

    <main id="main" tabindex="-1">
      <div id="banner" class="banner" role="status" hidden></div>

      <section id="standings" class="view" role="tabpanel" aria-labelledby="tab-standings" tabindex="0"></section>
      <section id="results" class="view" role="tabpanel" aria-labelledby="tab-results" tabindex="0" hidden></section>
      <section id="players" class="view" role="tabpanel" aria-labelledby="tab-players" tabindex="0" hidden></section>
      <section id="rules" class="view" role="tabpanel" aria-labelledby="tab-rules" tabindex="0" hidden></section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
