name: snapshot

on:
  schedule:
    - cron: '0 17-23 * * 0'   # Sun 1pm-7pm ET, during games
    - cron: '0 0-4 * * 1'     # Sun evening -> Mon midnight ET
    - cron: '0 6 * * 2'       # Tue 06:00 UTC — the run that carries MNF into
                              # the standings, sized against BOTH DST regimes
                              # rather than one UTC figure. MNF kicks at 20:15
                              # US Eastern: 00:15 UTC on EDT (weeks 1-7),
                              # 01:15 UTC on EST (weeks 8-18 — US DST ends
                              # Sun 1 Nov 2026, inside week 8), so the final
                              # whistle lands between ~03:35 and ~04:40 UTC and
                              # Sleeper still has to flip status to complete
                              # after it. 06:00 clears the later end by ~1h20m,
                              # enough for overtime or a Monday doubleheader.
                              # It stays ahead of the standings gate at Tue
                              # 10:00 Israel — 07:00 UTC on IDT, 08:00 UTC once
                              # Israel's own change lands on 25 Oct — by an
                              # hour either way. Without this run the last one
                              # before the gate is Monday midnight ET, and the
                              # week joins the standings missing MNF entirely.
    - cron: '0 13 * * 2'      # Tue 9am ET, sweep for stat corrections
    - cron: '0 6 * * 3,4,5,6'  # Wed-Sat 06:00 UTC — the morning after TNF and
                              # any midweek game. Nothing ran Wed-Sat before,
                              # and Thursday Night Football happens in 17 of
                              # the 18 weeks, so its results sat invisible in
                              # the archive until Sunday afternoon. Results
                              # never noticed (it re-fetches the live week);
                              # the Players leaderboard did, because it is
                              # aggregated by this Action and never in the
                              # browser. TNF kicks at 20:15 ET — 00:15 UTC
                              # Friday on EDT, 01:15 on EST — and ends around
                              # 03:35-04:40 UTC, so 06:00 clears it either way.
                              # The ladder was built around when the STANDINGS
                              # need to be right, and they only care about
                              # completed weeks; the leaderboard wants every
                              # game, not every week.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run engine tests
        run: npm test

      - name: Fetch and compute
        run: |
          attempt=1
          max_attempts=3
          delay=15
          until node scripts/snapshot.mjs; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "snapshot.mjs failed after $attempt attempts"
              exit 1
            fi
            echo "snapshot.mjs failed (attempt $attempt/$max_attempts), retrying in ${delay}s..."
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 4))
          done

      - name: Commit if anything changed
        run: |
          git config user.name  "givash-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "snapshot: $(date -u +%Y-%m-%d\ %H:%M) UTC"
            # A human commit can land between checkout and push; rebase onto it
            # rather than failing the run.
            git pull --rebase
            git push
          fi
