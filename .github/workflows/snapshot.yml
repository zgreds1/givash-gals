name: snapshot

on:
  schedule:
    - cron: '0 17-23 * * 0'   # Sun 1pm-7pm ET, during games
    - cron: '0 0-4 * * 1'     # Sun evening -> Mon midnight ET
    - cron: '0 13 * * 2'      # Tue 9am ET, sweep after Monday night
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run engine tests
        run: npm test

      - name: Fetch and compute
        run: |
          attempt=1
          max_attempts=3
          delay=15
          until node scripts/snapshot.mjs; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "snapshot.mjs failed after $attempt attempts"
              exit 1
            fi
            echo "snapshot.mjs failed (attempt $attempt/$max_attempts), retrying in ${delay}s..."
            sleep "$delay"
            attempt=$((attempt + 1))
            delay=$((delay * 4))
          done

      - name: Commit if anything changed
        run: |
          git config user.name  "givash-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "snapshot: $(date -u +%Y-%m-%d\ %H:%M) UTC"
            git push
          fi
